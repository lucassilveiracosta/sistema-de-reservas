services:
  # O Backend em NestJS
  - type: web
    name: reservas-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reservas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # O Frontend em Next.js
  - type: web
    name: reservas-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: reservas-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # O Banco de Dados PostgreSQL
  - name: reservas-db
    plan: free
